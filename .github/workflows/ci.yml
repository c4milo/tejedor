# What runs on each push to main, and when a person starts the workflow by hand. tejedor takes no
# pull requests, so no job runs for one.
#
# The jobs, each the command that a developer runs by hand:
#
#   - `test`: `zig build test`, on three kinds of GitHub-hosted runner: macOS on Apple silicon,
#     Linux on x86-64 and Linux on arm64. It runs the unit tests in Debug and in ReleaseSafe, and
#     each other check of the local gate. The tests run in both modes because the faults of the
#     context switch showed only in an optimized build (rotor's decision 34, "Upkeep").
#   - `linux-gate`: `zig build test-linux && bash tools/linux_test.sh PLATFORM`, the Linux gate, on
#     the runner of each Linux platform with its own processor. It runs each test of the package
#     with io_uring and with epoll in Docker, and the halt check with both (rotor's decision 34,
#     "Upkeep"). On the development Mac, Rosetta refuses each reactor of rotor for x86-64, so this
#     job is the run of the x86-64 tests on both backends.
#   - `probe`: `zig build bench-switch -- --machine github`, the probe of the context switch. It
#     runs only when a person starts the workflow by hand, on Linux on x86-64.
#   - `commits`: the commit linter over the commits that a push added to main. It runs on a push
#     only.
#
# The labels are rotor's. `macos-latest` is the macOS runner on Apple silicon. `ubuntu-26.04` and
# `ubuntu-26.04-arm` are the labels of rotor's jobs that hold no baseline, and `test` holds none.
# `ubuntu-24.04` is the label of rotor's cost probes, so `probe` runs there.
#
# No number from this workflow is a number of a quiet machine. The job `probe` prints what its
# runner is, because a result names its machine (rotor's decision 34, "The fiber switch has no
# measured cell").
#
# `.github/actions/zig` installs Zig. It downloads the tarball from ziglang.org and checks it
# against the SHA-256 that the release index publishes for the system and the processor of the
# runner. No third-party action runs here: `actions/checkout` and `actions/cache` are GitHub's
# own. Each job has a time limit, so a test that hangs ends the job.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: zig build test, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-latest }
          - { name: Linux x86-64, runner: ubuntu-26.04 }
          - { name: Linux arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: The whole local gate
        run: zig build test

  # The Linux gate, as a developer runs it by hand. The platform is the runner's own, so Docker runs
  # each executable on a real processor, and the kernel of the runner gives io_uring to a container
  # whose seccomp profile is relaxed.
  linux-gate:
    name: Linux gate, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, runner: ubuntu-26.04, platform: linux/amd64 }
          - { name: arm64, runner: ubuntu-26.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: The tests in Docker, with io_uring and with epoll
        run: zig build test-linux && bash tools/linux_test.sh ${{ matrix.platform }}

  # A person starts this job by hand, because it answers a question and guards no change. Camilo
  # reads the numbers of the probe before step 1 of the build order.
  #
  # The step `bench-switch` builds the probe of the context switch in ReleaseSafe, whatever the
  # options say, and runs it. The report names its machine `github`, and the step before it prints
  # what the runner is. A hosted runner is no quiet machine, so the report is no final number.
  probe:
    name: Linux x86-64, the probe of the switch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: What this runner is
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; uname -r; grep -m1 MemTotal /proc/meminfo
      - name: The probe
        run: zig build bench-switch -- --machine github

  # tejedor takes no pull requests, so this job checks the commits of a push after the push. The
  # pre-push hook checks them before the push, in a clone where a person ran `zig build hooks`.
  # This job finds a push from a clone that has no hook, and a push with `--no-verify`.
  #
  # `zig build lint-commits` checks `origin/main..HEAD`, which holds no commit after a push to
  # main. So the job installs the same linter, and gives it the range of the push. The range
  # starts at the commit that main named before the push, and ends at the commit that it names
  # now. The checkout takes the whole history, because the linter reads the commits from the
  # clone.
  #
  # A push that makes the branch names no commit before it, and GitHub then gives a hash of zeros.
  # The job fails with a message for that push, because it knows no range to check.
  commits:
    name: Commit messages
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/zig
      - name: Each commit of this push is a Conventional Commit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$BEFORE" in
            *[!0]*) ;;
            *) echo "this push names no commit before it, so the job knows no range" >&2; exit 1 ;;
          esac
          zig build install-commit-lint
          ./zig-out/bin/commit_lint --range "$BEFORE..$AFTER"
